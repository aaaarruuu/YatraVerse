version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: yatraverse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: yatraverse
      POSTGRES_USER: ${POSTGRES_USERNAME:-yatraverse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yatraverse}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME:-yatraverse} -d yatraverse"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: yatraverse-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-yatraverse}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-yatraverse123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  # One-shot helper: creates the media bucket so uploads work immediately.
  minio-init:
    image: minio/mc:latest
    container_name: yatraverse-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-yatraverse}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-yatraverse123}
      MINIO_BUCKET: ${MINIO_BUCKET:-yatraverse-media}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $$MINIO_ACCESS_KEY $$MINIO_SECRET_KEY; do sleep 2; done &&
      mc mb --ignore-existing local/$$MINIO_BUCKET
      "

  # backend:
  #   build: ./backend
  #   depends_on: [postgres, minio]
  #   ports: ["8080:8080"]
  #   env_file: .env

  # ai-service:
  #   build: ./ai-service
  #   depends_on: [postgres]
  #   ports: ["8000:8000"]
  #   env_file: .env

volumes:
  postgres-data:
  minio-data: