spring.application.name=yatraverse-backend
server.port=${PORT:8080}

spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/yatraverse}
spring.datasource.username=${POSTGRES_USERNAME:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:test123}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

spring.h2.console.enabled=false

jwt.secret=${JWT_SECRET:YatraVerseSuperSecretKeyForJWTSigning2026ChangeThisLater}
jwt.expiration=${JWT_EXPIRATION:86400000}

ai.service.url=${AI_SERVICE_URL:http://localhost:8000}